[pegasus_profile]
pycbc|primary_site = condorpool_symlink
pycbc|submit-directory = ./
condor|+InitialRequestMemory = 1980
condor|request_memory = ifthenelse( (LastHoldReasonCode=!=34 && LastHoldReasonCode=!=26), InitialRequestMemory, int(1.75 * NumJobStarts * MemoryUsage) )
#condor|periodic_release = ((HoldReasonCode =?= 34) || (HoldReasonCode =?= 26))
condor|request_disk = 1000
condor|accounting_group = keisi_post
#condor|requirements = (JobUniverse == 12) || (Target.Machine =!= LastRemoteHost)
#condor|onexithold = (ExitBySignal == true) || (ExitCode != 0 && NumJobStarts > 0)
#condor|periodic_release = (JobStatus == 5) && (HoldReasonCode >= 1 && HoldReasonCode <= 3) && (LastRemoteHost =!= UNDEFINED) || ((HoldReasonCode =?= 34) || (HoldReasonCode =?= 26))
condor|requirements = (JobUniverse == 12) || (NumJobStarts == 0) || (Target.Machine =!= LastRemoteHost)
condor|onexithold = (ExitBySignal == true) || (ExitCode != 0 && NumJobStarts > 0)
condor|periodic_release = (JobStatus == 5) && (NumJobStarts < 10) && ( ((HoldReasonCode >= 1 && HoldReasonCode <= 3) && (LastRemoteHost =!= UNDEFINED)) || (HoldReasonCode == 34) || (HoldReasonCode == 26) ) 
condor|periodic_remove = (JobStatus == 5) && ((CurrentTime - EnteredCurrentStatus) > 3600)

[pegasus_profile-condorpool_shared]
pycbc|site-scratch = ./
pycbc|unique-scratch = 
condor|request_disk = ifThenElse((LastHoldReasonCode =?= 26), int(1.5 * DiskUsage), MinimumDiskNeeded)
condor|+MinimumDiskNeeded = max({ifThenElse((isInteger(NumJobStarts) && (NumJobStarts > 0) && (DiskUsage =!= UNDEFINED) && (DiskUsage =!= ERROR)), DiskUsage, 0), InitialRequestDisk})
condor|+InitialRequestDisk = 20970


[pegasus_profile-inspiral]
condor|accounting_group = keisi_inspiral
#pegasus|clusters.size = 32
#condor|request_cpus = 16
#env|SEQEXEC_CPUS = 16
condor|requirements = (Machine != "CRUSH-OG-10-5-152-197") && (Machine != "CRUSH-OG-10-5-245-109") && (Machine != "128.230.11.10") && (Machine != "128.230.11.9")
dagman|retry = 50

# --- DYNAMIC MEMORY  ---
condor|+InitialRequestMemory = 2500
condor|+MinimumMemoryNeeded = max({ifThenElse((isInteger(NumJobStarts) && (NumJobStarts > 0) && (MemoryUsage =!= UNDEFINED) && (MemoryUsage =!= ERROR)), MemoryUsage, 0), InitialRequestMemory})
condor|request_memory = ifThenElse(((LastHoldReasonCode =?= 21) || (LastHoldReasonCode =?= 34)), int(1.5 * MemoryUsage), MinimumMemoryNeeded)

# --- NEW: DYNAMIC DISK ALLOCATION (Values in KiB) ---
# Start floor at 2 GB (2,097,152 KiB)
condor|+InitialRequestDisk = 500000

# Track peak usage if it started running
condor|+MinimumDiskNeeded = max({ifThenElse((isInteger(NumJobStarts) && (NumJobStarts > 0) && (DiskUsage =!= UNDEFINED) && (DiskUsage =!= ERROR)), DiskUsage, 0), InitialRequestDisk})

# If held for code 26 (Disk exceeded), scale up the request by 1.5x of recorded DiskUsage, otherwise use minimum floor
condor|request_disk = ifThenElse((LastHoldReasonCode =?= 26), int(1.5 * DiskUsage), MinimumDiskNeeded)

# --- JOB TIMEOUTS & SAFETY RELEASES ---
condor|Rank = ifThenElse(TARGET.CpuFamily == 6 && TARGET.CpuModelNumber == 94, 60, ifThenElse(TARGET.CpuFamily == 6 && TARGET.CpuModelNumber == 158, 50, 0))
condor|periodic_hold = (JobStatus == 2) && ((CurrentTime - EnteredCurrentStatus) > 86400)

# Release if held for Memory (21/34) or Disk (26)
condor|periodic_release = (HoldReasonCode == 34) || (HoldReasonCode == 21) || (HoldReasonCode == 26)

# Remove if it fails more than 5 times to prevent infinite loops
condor|periodic_remove = (NumJobStarts >= 5)

