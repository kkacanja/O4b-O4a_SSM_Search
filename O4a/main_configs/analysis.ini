
[workflow]
file-retention-level = merged_triggers
skip-online-dq = yes

h1-channel-name = H1:GWOSC-4KHZ_R1_STRAIN
l1-channel-name = L1:GWOSC-4KHZ_R1_STRAIN


[workflow-ifos]
h1 =
l1 =

[workflow-datafind]
datafind-method = FROM_PREGENERATED_LCF_FILES
datafind-pregenerated-cache-file-h1 = /home/sugwg/gwdata/o4a_frames_h1.lcf 
datafind-pregenerated-cache-file-l1 = /home/sugwg/gwdata/o4a_frames_l1.lcf 
datafind-check-segment-summary = no_test
datafind-check-segment-gaps = update_times
datafind-check-frames-exist = raise_error

[workflow-segments]
segments-method = ALL_SINGLE_IFO_TIME
segments-science = +DATA,-CBC_CAT1_VETO
segments-vetoes = +CBC_CAT2_VETO,+CBC_HW_INJ,+BURST_HW_INJ


[datafind]
urltype = file

[hdfinjfind]
injection-window = 2.0
optimal-snr-column = H1:optimal_snr_H1 L1:optimal_snr_L1 

[workflow-tmpltbank]
tmpltbank-method = PREGENERATED_BANK
tmpltbank-pregenerated-bank = /home/kkacanja/sub-solar-search/test_o4a/1day/smaller_subsearch/FIR_BANK_MERGED_FLAT.hdf

[workflow-splittable]
splittable-method = MANUAL_DIRECTORY

[workflow-splittable-full_data]
tmpltbank-directory = /home/kkacanja/sub-solar-search/banks/bank1_divided_by_4

[workflow-splittable-injections]
tmpltbank-directory = /home/kkacanja/sub-solar-search/banks/bank1_divided_by_4_inj



[workflow-matchedfilter]
matchedfilter-method = WORKFLOW_INDEPENDENT_IFOS
min-analysis-segments = 1
min-analysis-length = 1040
max-analysis-segments = 10

output-type = hdf
plot-throughput =

[workflow-coincidence]
do-trigger-fitting =

[workflow-coincidence-full_data]
timeslide-precedence = H1, L1, V1, K1, I1
parallelization-factor = 5

[coinc&sngls]
#ranking-statistic = phasetd_exp_fit_fgbg_norm
ranking-statistic = exp_fit
statistic-features = phasetd sensitive_volume normalize_fit_rate
statistic-keywords = alpha_below_thresh:6
sngl-ranking = newsnr_sgveto_psdvar
randomize-template-order =
statistic-files = ${resolve:../../statHL.hdf}

[workflow-singles]
; analyze =

[sngls]
#trigger-cuts = newsnr:5.5:lower traditional_chisq:12:upper sigma_multiple:10:upper
trigger-cuts = newsnr:6.0:lower traditional_chisq:10:upper sigma_multiple:10:upper

[coinc-full_data]
stage-input = 
timeslide-interval = 1.5
coinc-threshold = 0.002
nprocesses = 8

[workflow-coincidence-injections]
parallelization-factor = 1

[workflow-psd]
parallelization-factor = 30

[workflow-results]
max-hierarchical-removal = 1

[splitbank]
random-sort =

[inspiral]
#waveform-decompression-method = inline_quartic
#multiprocessing-nprocesses = 4
#use-compressed-waveforms =
batch-size = 8
fast-chisq =
fir-length = 4096
; amount of buffer data for letting filters settle
pad-data = 8

; conditioning high-pass filter
strain-high-pass = 15

; working sample rate for matched filtering
sample-rate = 2048
; segmentation of the data
; start-pad must be long enough to contain a full BNS signal
segment-length = 1024
;needs to be longer than our signal and needs to long for the padding 1024 segments
segment-start-pad = 528
;the padding at the beggining the lengths of the template and the other filtring needs to be 16+512  the end pad and the longests signal 
segment-end-pad = 16
;end pad needs to match the psd-inverse-length
; turn on zero-padding
allow-zero-padding =
; Taper the first and last second of data read in for zero padding
taper-data = 1

; estimation of the noise PSD and construction of the whitening filter
psd-estimation = median
psd-segment-length = 16
psd-segment-stride = 8
psd-inverse-length = 16
; 512s PSD length given by:
; 512s = psd-segment-length + (psd-num-segments - 1) * psd-segment-stride
psd-num-segments = 127


; PSD Variation options
psdvar-segment = 8
psdvar-short-segment = 0.25
psdvar-long-segment = 1024
psdvar-psd-duration = 8
psdvar-psd-stride = 4
psdvar-low-freq = 20
psdvar-high-freq = 480

; Autogating options
autogating-threshold = 30
autogating-max-iterations = 50
autogating-cluster = 0.5
autogating-width = 0.25
autogating-taper = 0.25
autogating-pad = 16

; Set to the starting freuqency of the bank
#enable-bank-start-frequency =
low-frequency-cutoff = 20

#approximant = TaylorF2
#order = -1

snr-threshold = 5.5
cluster-window = 1
chisq-iterations = 1000
chisq-snr-threshold = 6
chisq-bins = 64
newsnr-threshold = 5

sgchisq-snr-threshold = 6.0
sgchisq-locations = "mtotal>30:20-15,20-30,20-45,20-60,20-75,20-90,20-105,20-120"

filter-inj-only =
#finalize-events-template-rate = 500
injection-window = 4.5
processing-scheme = mkl

[inspiral-h1&calculate_psd-h1]
channel-name = ${workflow|h1-channel-name}

[single_template-h1&plot_singles_timefreq-h1&plot_qscan-h1]
frame-cache = ${workflow-datafind|datafind-pregenerated-cache-file-h1}
channel-name = ${workflow|h1-channel-name}

[inspiral-l1&calculate_psd-l1]
channel-name = ${workflow|l1-channel-name}

[single_template-l1&plot_singles_timefreq-l1&plot_qscan-l1]
frame-cache = ${workflow-datafind|datafind-pregenerated-cache-file-l1}
channel-name = ${workflow|l1-channel-name}

[calculate_psd]
cores = 4
low-frequency-cutoff = ${inspiral|low-frequency-cutoff}
pad-data = ${inspiral|pad-data}
strain-high-pass = ${inspiral|strain-high-pass}
sample-rate = ${inspiral|sample-rate}
segment-length = ${inspiral|segment-length}
segment-start-pad = ${inspiral|segment-start-pad}
segment-end-pad = ${inspiral|segment-end-pad}
psd-estimation = ${inspiral|psd-estimation}
psd-segment-length = ${inspiral|psd-segment-length}
psd-segment-stride = ${inspiral|psd-segment-stride}
psd-num-segments = ${inspiral|psd-num-segments}
taper-data = ${inspiral|taper-data}
autogating-threshold = ${inspiral|autogating-threshold}
autogating-cluster = ${inspiral|autogating-cluster}
autogating-width = ${inspiral|autogating-width}
autogating-taper = ${inspiral|autogating-taper}
autogating-pad = ${inspiral|autogating-pad}

[merge_psds]

[hdf_trigger_merge]

[bank2hdf]

[fit_by_template-defaultvalues]
sngl-ranking = newsnr_sgveto_psdvar_scaled_threshold

[fit_by_template]
fit-function = exponential
stat-threshold = 6.0
prune-param = mtotal
log-prune-param =
prune-bins = 2
prune-number = 2
 
[fit_over_param]
fit-param = mtotal
f-lower = ${inspiral|low-frequency-cutoff}
log-param = True
smoothing-width = 0.4

[coinc-full_data-2det]
loudest-keep-values = [15:5,10:30,5:30,0:30]

[coinc-full_data-3det]
loudest-keep-values = [15:5,10:30,5:30,0:30]

[coinc-inj]
stage-input =

[statmap&sngls_statmap]
max-hierarchical-removal = ${workflow-results|max-hierarchical-removal}
hierarchical-removal-against = exclusive

[statmap&statmap_inj&sngls_statmap&sngls_statmap_inj]
veto-window = 0.100
cluster-window = 10.0

[statmap]

[sngls_statmap]

[sngls_statmap&sngls_statmap_inj]
far-calculation-method = H1:trigger_fit L1:trigger_fit 
fit-function = H1:exponential L1:exponential 
fit-threshold = H1:-6 L1:-6 

[exclude_zerolag]

[exclude_zerolag-1det]
far-calculation-method = ${sngls_statmap|far-calculation-method}
fit-function = ${sngls_statmap|fit-function}
fit-threshold = ${sngls_statmap|fit-threshold}

[combine_statmap]
cluster-window = ${statmap|cluster-window}

[combine_statmap-full_data]
max-hierarchical-removal = ${workflow-results|max-hierarchical-removal}
hierarchical-removal-against = exclusive

[foreground_censor]

[results_page]
analysis-title = "PyCBC search"
analysis-subtitle = "Small Test Search"
